[package]
name = "search"
version = "0.1.0"
edition = "2024"
description = "Local filename search for Windows 11: in-RAM NTFS MFT index plus a timing CLI"
publish = false

[lib]
name = "search"
path = "src/lib.rs"

[[bin]]
name = "s"
path = "src/main.rs"

# The elevated helper: owns the index and answers the popup over a named pipe.
[[bin]]
name = "searchd"
path = "src/bin/searchd.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
memchr = "2.8"
rayon = "1.12"
rustc-hash = "2.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Kernel",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
