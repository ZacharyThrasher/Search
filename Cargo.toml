[package]
name = "search"
version = "0.1.0"
edition = "2024"
description = "Local filename search for Windows 11: in-RAM NTFS MFT index plus a timing CLI"
publish = false

[lib]
name = "search"
path = "src/lib.rs"

[[bin]]
name = "s"
path = "src/main.rs"

# The elevated helper: owns the index and answers the popup over a named pipe.
[[bin]]
name = "searchd"
path = "src/bin/searchd.rs"

# The indexer: a normal (unelevated) process. It subscribes to the helper's
# change events, hands files to extractor child processes and owns the content
# index (see src/content/).
[[bin]]
name = "searchi"
path = "src/bin/searchi.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
memchr = "2.8"
rayon = "1.12"
regex = "1"
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "dfa-build", "dfa-search", "unicode"] }
regex-syntax = "0.8"
rustc-hash = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
globset = "0.4"
tantivy = { version = "0.26", features = ["zstd-compression"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
encoding_rs = "0.8"
pdf-extract = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Ioctl",
    "Win32_System_Kernel",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
